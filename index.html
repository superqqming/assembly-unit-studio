<!doctype html>
<!-- 由 tests/build.mjs 從 index.html、css/、js/ 打包產生；請改原始碼後重新打包，不要直接改這個檔 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>組合單元工作室</title>
<style>
:root {
  --bg: #eef0f3;
  --panel: #ffffff;
  --ink: #1d2329;
  --muted: #5b6672;
  --faint: #8a939d;
  --line: #d9dde2;
  --line-soft: #e8ebee;
  --accent: #2f6fd6;
  --accent-weak: #e8f0fc;
  --danger: #c62828;
  --danger-weak: #fdecec;
  --warn: #9a5b00;
  --warn-weak: #fff4e0;
  --ok: #2e7d32;
  --radius: 8px;
  --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
}
/* 英文、越南文、印尼文介面：拉丁字母用系統字型（越南文的聲調符號比較完整），中文字再往後找 */
html:lang(en), html:lang(vi), html:lang(id) { --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
.topbar select.lang { height: 30px; max-width: 150px; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button, .btn {
  display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 11px;
  border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; white-space: nowrap;
}
button:hover, .btn:hover { border-color: #b9c0c8; background: #f8f9fa; }
button:focus-visible, .btn:focus-within, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: #255fbd; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
button.ghost:hover { background: var(--line-soft); color: var(--ink); }
button.small { height: 24px; padding: 0 8px; font-size: 12px; }
button.icon { width: 26px; height: 26px; padding: 0; justify-content: center; }
button:disabled { opacity: .45; cursor: default; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* ---- 頂列 ---- */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-height: 50px; padding: 9px 14px;   /* 按鈕字比較長（英文、越南文、印尼文）時換行，不被切掉 */
  background: #fff; border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.proj { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---- 主版面 ---- */
.layout { display: grid; grid-template-columns: minmax(380px, 460px) 1fr; height: calc(100% - var(--topbar-h, 50px)); }   /* --topbar-h：頂列實際高度（app.js 量） */
.editor { display: flex; flex-direction: column; min-height: 0; background: #fff; border-right: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { height: 34px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 0 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.panel { flex: 1; overflow: auto; padding: 12px 14px 40px; }
.preview { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.preview-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--line); }
.spacer { flex: 1; }
.status { font-weight: 600; }
.status.busy { color: var(--accent); }
.status.error { color: var(--danger); }
.zoom { display: flex; gap: 2px; }
.zoom button { height: 26px; padding: 0 9px; }
.pages { flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.sheet { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.06); flex: none; }
.sheet svg { display: block; width: 100%; height: auto; }
.issues { display: flex; flex-direction: column; gap: 4px; padding: 0 14px; }
.issues:not(:empty) { padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--line); max-height: 132px; overflow: auto; }
.issue { display: flex; gap: 6px; align-items: baseline; font-size: 12px; }
.issue b { flex: none; font-weight: 600; padding: 0 6px; border-radius: 4px; font-size: 11px; }
.issue.error b { background: var(--danger-weak); color: var(--danger); }
.issue.warn b { background: var(--warn-weak); color: var(--warn); }

/* ---- 編輯表單 ---- */
h3 { margin: 16px 0 8px; font-size: 13px; }
h3:first-child { margin-top: 2px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.row + .row { margin-top: 6px; }
.field { display: inline-flex; align-items: center; gap: 5px; }
.field > span { color: var(--muted); white-space: nowrap; }
.field input[type=number] { width: 66px; }
.field input[type=text] { width: 150px; }
.field.wide input[type=text] { width: 230px; }
input[type=number], input[type=text], select, textarea {
  height: 28px; padding: 0 7px; border: 1px solid var(--line); border-radius: 5px; background: #fff;
}
textarea { height: auto; padding: 5px 7px; width: 100%; resize: vertical; }
input.bad { border-color: var(--danger); background: var(--danger-weak); }
.check { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.unit { color: var(--faint); }
.hint { margin: 6px 0; color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }   /* 選項太長（例：英文）時換行，不超出左欄 */
.seg button { height: 28px; border: 0; border-radius: 0; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); font-weight: 600; }

/* 工件分頁 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { height: 30px; border-radius: 15px; padding: 0 12px 0 8px; gap: 6px; }
.chip .dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; }
.stage { flex: none; width: 92px; padding: 4px; border: 1px solid var(--line-soft); border-radius: 6px; text-align: center; font-size: 11px; color: var(--muted); }
.stage svg { width: 82px; height: 74px; display: block; margin: 0 auto 2px; }
.stage b { display: block; color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.card + .card { margin-top: 10px; }
.card-head { display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 10px; border-bottom: 1px solid var(--line-soft); background: #fafbfc; border-radius: var(--radius) var(--radius) 0 0; }
.card-head .num { font-weight: 700; color: var(--accent); }
.card-head input[type=text] { flex: 1; min-width: 0; font-weight: 600; }
.card-body { padding: 8px 10px 10px; }
.feature { border: 1px solid var(--line-soft); border-radius: 6px; padding: 8px; margin-top: 8px; background: #fcfcfd; }
.feature-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.feature-head strong { font-size: 12.5px; }
.feature-body { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
.feature-fields { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.face-sketch { width: 118px; flex: none; }
.face-sketch svg { width: 118px; height: auto; display: block; }
.face-sketch figcaption { font-size: 10.5px; color: var(--faint); text-align: center; }
.rect-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 6px; border-radius: 5px; background: #f3f5f7; }
.edges { display: grid; grid-template-columns: repeat(4, auto); gap: 2px 10px; }
.add-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.empty { padding: 14px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; }

/* 組合分頁 */
.mate { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line-soft); border-radius: 6px; background: #fcfcfd; }
.mate + .mate { margin-top: 8px; }
.mate select { width: 100%; min-width: 0; }
.mate .who { display: flex; gap: 6px; min-width: 0; }
.mate .who select:first-child { flex: 0 0 92px; }
.mate .lbl { color: var(--muted); white-space: nowrap; }
.mate .tools { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.verdict { margin: 10px 0; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; }
.verdict.ok { background: #e9f5ea; color: var(--ok); }
.verdict.bad { background: var(--danger-weak); color: var(--danger); }
.verdict.warn { background: var(--warn-weak); color: var(--warn); }
.asm-view svg { width: 100%; max-height: 320px; display: block; }
.swatches { display: inline-flex; gap: 3px; vertical-align: middle; }
.swatches i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.12); }
.pal-opt { display: flex; align-items: center; gap: 8px; }

.mate .mate-note { grid-column: 1 / -1; }
.mate .mate-note .verdict { margin: 2px 0 0; }
/* 自動找組合 */
.combo-group { margin-top: 12px; }
.combo-head { font-weight: 600; margin-bottom: 6px; }
.combo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.combo-tile { border: 1px solid var(--line); border-radius: 6px; padding: 6px; background: #fff; display: flex; flex-direction: column; gap: 4px; }
.combo-tile.added { border-color: #b7dbb9; background: #f3faf3; }
.combo-tile .thumb svg { width: 100%; height: auto; display: block; }
.combo-tile .cap { font-size: 11.5px; line-height: 1.4; color: var(--ink); flex: 1; }
.combo-tile .acts { display: flex; gap: 4px; flex-wrap: wrap; }

/* AI 辨識 */
.drop { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 8px; padding: 10px; border: 1.5px dashed var(--line); border-radius: var(--radius); background: #fafbfc; }
.drop.over { border-color: var(--accent); background: var(--accent-weak); }
.drop .pick { flex: 1; min-width: 160px; min-height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: var(--accent); text-align: center; }
.drop .pick small { color: var(--faint); }
.shot { position: relative; margin: 0; width: 96px; }
.shot img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.shot figcaption { font-size: 10.5px; color: var(--faint); text-align: center; }
.shot button { position: absolute; top: 2px; right: 2px; background: rgba(255,255,255,.9); }
.question { margin-top: 6px; padding: 7px 9px; border-radius: 6px; background: var(--warn-weak); }
.question .options { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
ol.steps { margin: 8px 0 4px; padding-left: 20px; }
ol.steps li { margin: 2px 0; }
.verdict:empty { display: none; }

/* 列印：只印圖面 */
.print-root { display: none; }
@media print {
  body { background: #fff; }
  .topbar, .layout { display: none !important; }
  .print-root { display: block; }
  .print-page { break-after: page; overflow: hidden; }
  .print-page:last-child { break-after: auto; }
  .print-page svg { display: block; width: 100%; height: 100%; }
}

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .editor { border-right: 0; border-bottom: 1px solid var(--line); }
  .panel { max-height: none; }
  .pages { overflow: visible; }
  .topbar { height: auto; flex-wrap: wrap; padding: 8px 12px; }
}

/* 摺疊卡片（AI 分頁的老師管理面板） */
details.card > summary { cursor: pointer; list-style: none; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before { content: '▸'; color: var(--muted); }
details.card[open] > summary::before { content: '▾'; }
details.card:not([open]) > summary { border-bottom: 0; border-radius: var(--radius); }
details.card.admin { margin-top: 18px; }
.card hr { border: 0; border-top: 1px solid var(--line-soft); margin: 10px 0; }

/* 畫面內對話框（取代 confirm／alert；協作平台的嵌入框會擋掉瀏覽器的對話框） */
.dlg-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 24, 31, .38); }
.dlg { width: 100%; max-width: 440px; padding: 18px 18px 14px; border-radius: 10px; background: #fff; box-shadow: 0 14px 44px rgba(0, 0, 0, .28); font-size: 13.5px; line-height: 1.65; }
.dlg p { margin: 0; white-space: pre-line; }
.dlg-link { display: inline-block; margin-top: 12px; padding: 7px 14px; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
.dlg-link:hover { opacity: .9; }
.dlg-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
@media print { .dlg-overlay { display: none !important; } }

/* AI 雙入口（js/ai/ai-access.js 的元件）：放進卡片裡、跟工具一樣用淺色 */
.ai-dual .aia { border: 0; padding: 0; background: transparent; }
.v1-import { margin: 6px 0 2px; }
.v1-import > summary { cursor: pointer; font-size: 12.5px; }
.v1-import .row { margin-top: 6px; }

/* 打開時載入了這台電腦上次的作品（共用電腦一眼看出不是自己的） */
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 8px 10px 0; padding: 8px 10px; border-radius: 6px; background: #eef4ff; color: #1d3b6e; font-size: 12.5px; }
.notice span { flex: 1 1 260px; }
/* 被放在協作平台的框裡：請同學改在新分頁開（顏色沿用 v1 登入頁的提示） */
.notice.embed { border: 1px solid #f3c9c9; background: #fef6f6; color: #7f1d1d; line-height: 1.6; }
a.go { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 6px; background: var(--danger); color: #fff; font-weight: 600; text-decoration: none; white-space: nowrap; }
a.go:hover { filter: brightness(1.08); }
@media (prefers-color-scheme: dark) {
  .ai-dual .aia { color: #1d2330; }
  .ai-dual .aia input, .ai-dual .aia select, .ai-dual .aia button { background: #fff; color: inherit; border-color: #d9dde3; }
  .ai-dual .aia .aia-sub, .ai-dual .aia .aia-msg:not(.err):not(.ok) { color: #6b7383; }
}
</style>
<style id="pageStyle">@page{size:210mm 297mm;margin:0}</style>
</head>
<body>
<header class="topbar">
  <div class="brand" data-i18n>組合單元工作室</div>
  <div class="proj" id="projName"></div>
  <div class="actions">
    <button type="button" id="btnUndo" title="復原上一步（⌘Z／Ctrl+Z）" data-i18n-title data-i18n disabled>↶ 復原</button>
    <button type="button" id="btnRedo" title="重做（⇧⌘Z／Ctrl+Y）" data-i18n-title data-i18n disabled>↷ 重做</button>
    <button type="button" id="btnNew" data-i18n>新專案</button>
    <button type="button" id="btnExample" data-i18n>老師範例</button>
    <label class="btn" title="匯入先前存的專案檔（.json）" data-i18n-title><span data-i18n>匯入</span><input type="file" id="fileImport" accept=".json,application/json" hidden></label>
    <button type="button" id="btnJson" data-i18n>存成 JSON</button>
    <button type="button" id="btnSvg" data-i18n>匯出 SVG</button>
    <button type="button" id="btnPrint" class="primary" data-i18n>匯出 PDF</button>
  </div>
</header>

<main class="layout">
  <section class="editor" aria-label="編輯" data-i18n-aria-label>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="parts" data-i18n>工件</button>
      <button type="button" role="tab" data-tab="assembly" data-i18n>組合</button>
      <button type="button" role="tab" data-tab="ai" data-i18n>AI 辨識</button>
      <button type="button" role="tab" data-tab="settings" data-i18n>設定</button>
    </nav>
    <div id="panel" class="panel"></div>
  </section>

  <section class="preview" aria-label="圖面預覽" data-i18n-aria-label>
    <div class="preview-bar">
      <span id="status" class="status">載入幾何核心…</span>
      <span class="spacer"></span>
      <span id="sheetInfo" class="muted"></span>
      <div class="zoom" role="group" aria-label="縮放" data-i18n-aria-label>
        <button type="button" data-zoom="-" title="縮小" data-i18n-title>−</button>
        <button type="button" data-zoom="fit" title="符合寬度" data-i18n-title data-i18n>符合</button>
        <button type="button" data-zoom="+" title="放大" data-i18n-title>＋</button>
      </div>
    </div>
    <div id="issues" class="issues"></div>
    <div id="pages" class="pages"></div>
  </section>
</main>

<div id="printRoot" class="print-root"></div>

    const tk = Math.min(1, 240 / Math.max(w, h2));
    const tc = document.createElement("canvas");
    tc.width = Math.round(w * tk);
    tc.height = Math.round(h2 * tk);

  const choices = S.choices[i] || (S.choices[i] = []);
  const { draft, failed } = applyChoices(dp, choices);
  const no = app2.project.parts.length + 1;
  const { part, issues } = toPart(draft, no);
  const strip2 = h("div", { class: "strip" });
  const geo = previewPart(app2, part, strip2);
  const s = part.stock;
  const questions = (dp.uncertain || []).map((q, qi) => h(
    "div",
    { class: "question" },
    h("div", {}, q.question),
    h("div", { class: "options" }, q.options.map((op, oi) => {
      const id = `q${i}-${qi}-${oi}`;
      const radio = h("input", { type: "radio", name: `q${i}-${qi}`, id });
      radio.checked = (choices[qi] ?? q.chosen) === oi;
      radio.addEventListener("change", () => {
        choices[qi] = oi;
        renderResult(panel, app2);
      });
      return h("label", { for: id, class: "check" }, radio, op.label);
    }))
  ));
  const P = app2.project, cur = P.parts[app2.ui.part];
  return h(
    "div",
    { class: "card" },
    h("div", { class: "card-head" }, h("strong", {}, part.name), h("span", { class: "muted" }, t("料塊 {w}×{d}×{h}", { w: s.w, d: s.d, h: s.h }))),
    h(
      "div",
      { class: "card-body" },
      strip2,
      [...issues, ...failed.map((q) => t("無法套用「{q}」的選擇", { q })), ...geo].map((msg) => h("div", { class: "verdict warn" }, msg)),
      questions.length ? [h("div", { class: "muted", style: { marginTop: "8px" } }, t("請確認：")), questions] : null,
      h("ol", { class: "steps" }, part.steps.map((st) => h("li", {}, h("b", {}, st.label), st.note ? `　${st.note}` : ""))),
      h("p", { class: "hint" }, t("特徵：{list}", { list: summarizePart(part) || t("（沒有加工）") })),
      (dp.assumptions || []).length ? h("p", { class: "hint" }, t("AI 的假設：{list}", { list: dp.assumptions.join("；") })) : null,
      h(
        "div",
        { class: "add-row" },
        button(t("加入為新工件"), () => {
          addPart2(app2, part);
        }, { class: "primary" }),
        cur ? button(t("取代「{name}」", { name: cur.name }), () => {
          replacePart(app2, part);
        }, { class: "small" }) : null
      )
    )
  );
}
function previewPart(app2, part, strip2) {
  if (!app2.ready) {
    strip2.replaceChildren(h("span", { class: "muted" }, t("幾何核心載入中…")));
    return [];
  }
  const P = app2.project;
  const project = { ...JSON.parse(JSON.stringify(P)), parts: [JSON.parse(JSON.stringify(part))], assemblies: [] };
  let model = null;
  try {
    model = prepareModel(project);
    const mp = model.parts[0];
    if (mp) strip2.replaceChildren(...mp.stages.map((st, i) => {
      const el = h("div", { class: "stage", html: stageSVG(mp, i, model.palette) });
      el.append(h("b", {}, i ? `${"①②③④⑤⑥⑦⑧⑨⑩"[i - 1] || i} ${st.label}` : t("料塊")), h("span", {}, i ? st.note : `${part.stock.w}×${part.stock.d}×${part.stock.h}`));
      return el;
    }));
    return model.issues.map((x) => x.msg);
  } catch (err) {
    return [t("幾何建立失敗：{msg}", { msg: err.message })];
  } finally {
    disposeModel(model);
  }
}
function addPart2(app2, part) {
  const P = app2.project;
  part.name = uniqueName(P, part.name);
  P.parts.push(part);
  app2.ui.part = P.parts.length - 1;
  app2.ui.tab = "parts";
  app2.changed(true);
}
async function replacePart(app2, part) {
  const P = app2.project, old = P.parts[app2.ui.part];
  if (!await ask(t("用辨識結果取代「{name}」？原本的加工步驟會被換掉；用到它舊配合點的組合需要重新選。", { name: old.name }), { ok: t("取代") })) return;
  const i = P.parts.indexOf(old);
  if (i < 0) return;
  part.id = old.id;
  P.parts[i] = part;
  app2.ui.tab = "parts";
  app2.changed(true);
}
function uniqueName(P, name) {
  if (!P.parts.some((p) => p.name === name)) return name;
  for (let k = 2; ; k++) if (!P.parts.some((p) => p.name === `${name}（${k}）`)) return `${name}（${k}）`;
}

var safeName = (s) => String(s || "組合單元").replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 40) || "組合單元";
function preparePrint(sheet) {
  const root = document.getElementById("printRoot");
  if (!sheet || !sheet.pages.length) {
    root.replaceChildren();
    return false;
  }
  const { w, h: h2 } = sheet.pages[0];
  document.getElementById("pageStyle").textContent = `@page{size:${w}mm ${h2}mm;margin:0}`;
  root.innerHTML = sheet.pages.map((pg) => `<div class="print-page" style="width:${pg.w}mm;height:${pg.h}mm">${toSVG(pg.D, pg, { css: true })}</div>`).join("");
  return true;
}
function clearPrint() {
  document.getElementById("printRoot").replaceChildren();
}
function printSheet(sheet) {
  if (!preparePrint(sheet)) {
    tell(t("圖面還沒有準備好，請等上方顯示「已更新」再試。"));
    return;
  }
  setTimeout(() => {
    const t0 = performance.now();
    window.print();
    if (embeddedElsewhere() && performance.now() - t0 < 300) {
      clearPrint();
      tell(
        t("如果沒有出現列印視窗：你是在協作平台頁面裡的嵌入畫面使用，瀏覽器不允許在這裡列印，所以無法匯出 PDF。") + "\n\n" + t("請按下面的連結在新分頁開啟工具。嵌入畫面和新分頁的自動存檔是分開的：請先按上方「存成 JSON」，到新分頁再按「匯入」。"),
        { extra: newTabLink() }
      );
    }
  }, 50);
}
function exportSVG(sheet, title) {
  if (!sheet || !sheet.pages.length) {
    tell(t("圖面還沒有準備好，請等上方顯示「已更新」再試。"));
    return;
  }
  const base = safeName(title);
  sheet.pages.forEach((pg, i) => {
    const name = sheet.pages.length > 1 ? `${base}-${i + 1}.svg` : `${base}.svg`;
    setTimeout(() => download(name, toSVG(pg.D, pg), "image/svg+xml"), i * 400);
  });
}
function exportJSON(project) {
  const data = JSON.stringify({ ...project, version: SCHEMA_VERSION }, null, 2);
  download(`${safeName(project.meta && project.meta.title)}.json`, data, "application/json");
}

var HIST_MAX = 100;

var composing = false;

  composing = true;
}, true);
document.addEventListener("compositionend", () => {

  if (hist.timer) histNote(false);
}, true);
var histFlush = () => {
  if (hist.timer && !composing) histCommit();
};
document.addEventListener("pointerdown", histFlush, true);
document.addEventListener("focusout", histFlush, true);

  if (!hist.timer) hist.cur = JSON.stringify(app.project);
}
function histReset() {
  clearTimeout(hist.timer);

  hist.past = [];
  hist.future = [];

  updateUndoButtons();
}
function histCommit(force = false) {
  if (!force && composing) {
    clearTimeout(hist.timer);
    hist.timer = setTimeout(histCommit, 600);
    return;
  }
  clearTimeout(hist.timer);
  hist.timer = null;
  const now = JSON.stringify(app.project);
  if (now === hist.cur) {
    updateUndoButtons();
    return;
  }
  hist.past.push(hist.cur);
  if (hist.past.length > HIST_MAX) hist.past.shift();
  hist.cur = now;
  hist.future = [];
  updateUndoButtons();
}
function histNote(structural) {
  if (structural) {
    histCommit(true);
    return;
  }
  clearTimeout(hist.timer);
  hist.timer = setTimeout(histCommit, 600);
  updateUndoButtons(true);
}
function undo() {
  histCommit(true);
  if (!hist.past.length) return;
  hist.future.push(hist.cur);
  hist.cur = hist.past.pop();
  restoreSnapshot();
}
function redo() {
  histCommit(true);
  if (!hist.future.length) return;
  hist.past.push(hist.cur);
  hist.cur = hist.future.pop();
  restoreSnapshot();
}
function restoreSnapshot() {
  dismissRestored();

  app.ui.part = Math.max(0, Math.min(app.ui.part || 0, app.project.parts.length - 1));
  if (app.autoCombo) {
    app.autoCombo.geo = null;
